name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :quiz-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug spotlessCheck --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            quiz-core/build/reports/
            app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
